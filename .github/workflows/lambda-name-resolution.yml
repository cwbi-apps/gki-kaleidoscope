name: Lambda - Name Resolution OpenSearch

on:
  push:
    branches:
      - main
    paths:
      - "lambda/name-resolution-opensearch/**"
      - ".github/workflows/lambda-name-resolution.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - test

      ref:
        description: Git commit SHA, branch, or tag to deploy
        required: true
        default: main

concurrency:
  group: name-resolution-opensearch-lambda-${{ github.event_name == 'push' && 'dev' || inputs.environment }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  AWS_REGION: us-gov-west-1
  LAMBDA_DIR: lambda/name-resolution-opensearch
  FUNCTION_NAME: name-resolution-opensearch
  DEPLOY_ENV: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}

permissions:
  id-token: write
  contents: read

jobs:
  upload-lambda:
    name: Build and upload name-resolution-opensearch Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure deployment environment
        run: |
          set -euo pipefail

          case "$DEPLOY_ENV" in
            dev)
              echo "S3_BUCKET=gki-kaleidoscope-agents-dev" >> "$GITHUB_ENV"
              echo "AWS_ROLE_ARN=arn:aws-us-gov:iam::718787032875:role/github-actions-s3-gki-kaleidoscope" >> "$GITHUB_ENV"
              ;;
            test)
              echo "S3_BUCKET=gki-kaleidoscope-agents-test" >> "$GITHUB_ENV"
              echo "AWS_ROLE_ARN=arn:aws-us-gov:iam::276847049069:role/github-actions-s3-gki-kaleidoscope" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported deployment environment: $DEPLOY_ENV"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Build Lambda package
        run: |
          set -euo pipefail

          chmod +x "${LAMBDA_DIR}/build.sh"
          "${LAMBDA_DIR}/build.sh"

      - name: Upload Lambda package to S3
        run: |
          set -euo pipefail

          echo "Environment: $DEPLOY_ENV"
          echo "Bucket:      $S3_BUCKET"

          aws s3 cp \
            "${LAMBDA_DIR}/function.zip" \
            "s3://${S3_BUCKET}/lambda/${FUNCTION_NAME}/function.zip"

      - name: Show uploaded file
        run: |
          aws s3 ls \
            "s3://${S3_BUCKET}/lambda/${FUNCTION_NAME}/function.zip"
