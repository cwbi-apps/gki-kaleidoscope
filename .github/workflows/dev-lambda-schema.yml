name: Upload Schema Lambda to Dev S3

on:
  push:
    branches:
      - main
    paths:
      - "lambda/schema/**"
      - ".github/workflows/dev-lambda-schema.yml"

  workflow_dispatch:

concurrency:
  group: schema-lambda-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-gov-west-1
  S3_BUCKET: gki-kaleidoscope-agents-dev
  LAMBDA_DIR: lambda/schema
  FUNCTION_NAME: schema

permissions:
  id-token: write
  contents: read

jobs:
  upload-lambda:
    name: Build and upload schema Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws-us-gov:iam::718787032875:role/github-actions-s3-gki-kaleidoscope

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Build Lambda package
        run: |
          set -euo pipefail

          chmod +x "${LAMBDA_DIR}/build.sh"
          "${LAMBDA_DIR}/build.sh"

      - name: Upload Lambda package to S3
        run: |
          set -euo pipefail

          aws s3 cp \
            "${LAMBDA_DIR}/function.zip" \
            "s3://${S3_BUCKET}/lambda/${FUNCTION_NAME}/function.zip"

      - name: Show uploaded file
        run: |
          aws s3 ls \
            "s3://${S3_BUCKET}/lambda/${FUNCTION_NAME}/function.zip"
