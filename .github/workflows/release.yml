name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 1.2.0). The tag will have this name."
        required: true
        type: string
      next_version:
        description: "Next development version (e.g. 1.3.0-SNAPSHOT)"
        required: true
        type: string
      dry_run:
        description: "Dry run: do everything except push commits and the tag"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.release_version }}
  NEXT_VERSION: ${{ inputs.next_version }}
  MAVEN_ARGS: -B --no-transfer-progress

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags are required for changelog generation
          fetch-depth: 0
          # If the branch is protected, set a RELEASE_TOKEN secret (PAT / app token) allowed to push to it
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Validate inputs
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_version '$RELEASE_VERSION' must look like X.Y.Z"
            exit 1
          fi
          if [[ -z "$NEXT_VERSION" || "$NEXT_VERSION" == "$RELEASE_VERSION" ]]; then
            echo "::error::next_version must be set and differ from release_version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" > /dev/null; then
            echo "::error::Tag $RELEASE_VERSION already exists"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply license headers
        run: |
          mvn license:format
          git add -u
          git diff --cached --quiet || git commit --no-verify -m "chore(release): license headers for $RELEASE_VERSION"

      - name: Set release version
        run: mvn versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true

      # Builds the UI (via frontend-maven-plugin) and then the API, running the Java unit tests.
      # The API tests depend on the built UI being present, so this must be a full reactor build.
      - name: Build and run Java tests
        run: mvn verify

      - name: Run front-end tests
        working-directory: geo-ai-explorer-ui
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Commit release version, tag, and generate changelog
        run: |
          git add -u
          git commit --no-verify -m "chore(release): release $RELEASE_VERSION"

          # The changelog plugin groups commits by tag, so tag first, generate, then fold the
          # changelog into the release commit and move the tag onto the amended commit.
          git tag "$RELEASE_VERSION"
          mvn -N se.bjurr.gitchangelog:git-changelog-maven-plugin:git-changelog

          if [[ -f CHANGELOG.md ]]; then
            { head -n 1 CHANGELOG.md; echo; cat target/CHANGELOG-release.md; tail -n +2 CHANGELOG.md; } > target/CHANGELOG.new.md
          else
            { echo "# Release Notes"; echo; cat target/CHANGELOG-release.md; } > target/CHANGELOG.new.md
          fi
          mv target/CHANGELOG.new.md CHANGELOG.md

          git add CHANGELOG.md
          git commit --no-verify --amend --no-edit
          git tag -f -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"

          {
            echo "## Release notes for $RELEASE_VERSION"
            cat target/CHANGELOG-release.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set next development version
        run: |
          mvn versions:set -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true
          git add -u
          git commit --no-verify -m "chore(release): prepare for next development iteration $NEXT_VERSION"

      - name: Push
        run: |
          git log --oneline --decorate -5
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "Dry run: skipping push"
            exit 0
          fi
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/$RELEASE_VERSION"
