<div id="attr-panel">
  @if (geoObject != null) {
    <div class="inspector-content">
      @if ((geoObject!.properties | keyvalue); as items) {
        <p-table [value]="items" [scrollable]="true" scrollHeight="flex" [size]="'small'" stripedRows showGridlines>
          <!-- <ng-template #header>
          <tr>
            <th></th>
            <th></th>
          </tr>
        </ng-template> -->
        <ng-template #body let-item>
          <tr>
            <td style="word-wrap:normal;">{{ item.key }}</td>
            <td>{{ item.value }}</td>
          </tr>
        </ng-template>
      </p-table>
    }
  </div>
}
</div>
